openapi: 3.1.0
info:
  title: TableBook
  version: 0.4.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /v1/auth/me:
    get:
      operationId: getAccountRole
      security:
        - bearer: []
      responses:
        '200':
          description: Role of the current account.
          content:
            application/json:
              schema:
                type: object
                required: [role]
                properties:
                  role: {type: string, enum: [guest, admin]}
        '401': {$ref: '#/components/responses/Error'}
  /v1/admin/reservations:
    get:
      operationId: listAdminReservations
      security:
        - bearer: []
      parameters:
        - {name: hallId, in: query, required: true, schema: {$ref: '#/components/schemas/PositiveId'}}
        - {name: day, in: query, required: true, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {type: string, enum: [confirmed, seated, completed, cancelled]}}
      responses:
        '200':
          description: Reservations intersecting the selected local day.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Reservation'
                    - type: object
                      required: [tableLabel, guestEmail]
                      properties:
                        tableLabel: {type: string}
                        guestEmail: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: createReservationForGuest
      security:
        - bearer: []
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, tableId, guestCount, startsAt]
              properties:
                email: {type: string, format: email}
                tableId: {$ref: '#/components/schemas/PositiveId'}
                guestCount: {$ref: '#/components/schemas/GuestCount'}
                startsAt: {$ref: '#/components/schemas/StartTime'}
      responses:
        '201':
          description: Reservation created for the registered guest.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/admin/reservations/{id}/status:
    post:
      operationId: changeReservationStatus
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expectedVersion]
              properties:
                status: {type: string, enum: [seated, completed, cancelled]}
                expectedVersion: {$ref: '#/components/schemas/PositiveId'}
      responses:
        '204':
          description: Status updated.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/halls:
    get:
      operationId: listHalls
      responses:
        '200':
          description: Halls and their local time zones.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Hall'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/halls/{id}/availability:
    get:
      operationId: getAvailability
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: startsAt
          in: query
          required: true
          schema: {$ref: '#/components/schemas/StartTime'}
        - name: guestCount
          in: query
          required: true
          schema: {$ref: '#/components/schemas/GuestCount'}
      responses:
        '200':
          description: Availability for the selected party and two-hour interval. The create endpoint confirms actual availability.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [tableId, available]
                  properties:
                    tableId: {$ref: '#/components/schemas/PositiveId'}
                    available: {type: boolean}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/reservations/{id}/cancel:
    post:
      operationId: cancelOwnReservation
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Future reservation cancelled or already cancelled.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/auth/register:
    post:
      operationId: register
      requestBody: {$ref: '#/components/requestBodies/Credentials'}
      responses:
        '201': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/auth/login:
    post:
      operationId: login
      requestBody: {$ref: '#/components/requestBodies/Credentials'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      requestBody: {$ref: '#/components/requestBodies/RefreshToken'}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/auth/logout:
    post:
      operationId: logout
      requestBody: {$ref: '#/components/requestBodies/RefreshToken'}
      responses:
        '204':
          description: Session revoked or already absent.
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/reservations/{id}:
    get:
      operationId: getOwnReservation
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reservation owned by the authenticated account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /v1/halls/{id}/floor-plan:
    get:
      operationId: getFloorPlan
      summary: Read the geometry of a hall
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Hall geometry. Coordinates use the top-left origin and refer to table centers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloorPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: HALL_NOT_FOUND
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/reservations:
    get:
      operationId: listOwnReservations
      security:
        - bearer: []
      responses:
        '200':
          description: Caller reservations, ordered by descending start time.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/OwnedReservation'}
        '401': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createReservation
      summary: Confirm a two-hour reservation
      security:
        - bearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per user and create operation. Reuse after a timeout with the same inputs.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservation'
      responses:
        '201':
          description: Original confirmed reservation, also returned on an idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: UNAUTHENTICATED
          $ref: '#/components/responses/Error'
        '409':
          description: TABLE_UNAVAILABLE or IDEMPOTENCY_KEY_REUSED
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/admin/reservations/{id}/schedule:
    post:
      operationId: rescheduleReservation
      summary: Move a confirmed reservation as an administrator
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveReservation'}
      responses:
        '200':
          description: Updated reservation with a new version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reservation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    patch:
      operationId: moveReservation
      summary: Move a confirmed reservation as an administrator
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveReservation'
      responses:
        '200':
          description: Updated reservation with a new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: UNAUTHENTICATED
          $ref: '#/components/responses/Error'
        '403':
          description: FORBIDDEN
          $ref: '#/components/responses/Error'
        '404':
          description: RESERVATION_NOT_FOUND
          $ref: '#/components/responses/Error'
        '409':
          description: TABLE_UNAVAILABLE or STALE_RESERVATION. The original reservation is preserved.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email, password]
            properties:
              email: {type: string, format: email}
              password: {type: string, format: password, description: Registration requires 15 characters minimum and 512 UTF-8 bytes maximum.}
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [refreshToken]
            properties:
              refreshToken: {type: string}
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PositiveId'
  responses:
    Session:
      description: Access token valid for up to 15 minutes and a rotating refresh token with a 30-day absolute session lifetime.
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, refreshToken]
            properties:
              accessToken: {type: string}
              refreshToken: {type: string}
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: INVALID_REQUEST, INVALID_TABLE, INVALID_GUEST_COUNT, INVALID_START_TIME, INVALID_IDEMPOTENCY_KEY or INVALID_VERSION
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Hall:
      type: object
      required: [id, name, timeZone]
      properties:
        id: {$ref: '#/components/schemas/PositiveId'}
        name: {type: string}
        timeZone: {type: string}
    OwnedReservation:
      allOf:
        - $ref: '#/components/schemas/Reservation'
        - type: object
          required: [tableLabel, hallName, timeZone]
          properties:
            tableLabel: {type: string}
            hallName: {type: string}
            timeZone: {type: string}
    Error:
      type: object
      required: [code]
      properties:
        code: {type: string}
    PositiveId:
      type: integer
      format: int64
      minimum: 1
    StartTime:
      type: string
      format: date-time
      description: RFC 3339 with explicit offset and at most microsecond precision (additional trailing zeros are accepted).
    GuestCount:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
    CreateReservation:
      type: object
      additionalProperties: false
      required: [tableId, guestCount, startsAt]
      properties:
        tableId: {$ref: '#/components/schemas/PositiveId'}
        guestCount: {$ref: '#/components/schemas/GuestCount'}
        startsAt: {$ref: '#/components/schemas/StartTime'}
    MoveReservation:
      type: object
      additionalProperties: false
      required: [tableId, startsAt, expectedVersion]
      properties:
        tableId: {$ref: '#/components/schemas/PositiveId'}
        startsAt: {$ref: '#/components/schemas/StartTime'}
        expectedVersion: {$ref: '#/components/schemas/PositiveId'}
    Reservation:
      type: object
      required: [id, tableId, guestCount, startsAt, endsAt, status, version]
      properties:
        id: {$ref: '#/components/schemas/PositiveId'}
        tableId: {$ref: '#/components/schemas/PositiveId'}
        guestCount: {$ref: '#/components/schemas/GuestCount'}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [confirmed, seated, completed, cancelled]}
        version: {$ref: '#/components/schemas/PositiveId'}
    FloorPlan:
      type: object
      required: [id, name, timeZone, width, height, tables, serverTime]
      properties:
        id: {$ref: '#/components/schemas/PositiveId'}
        name: {type: string}
        timeZone: {type: string}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        serverTime: {type: string, format: date-time}
        tables:
          type: array
          items:
            $ref: '#/components/schemas/FloorTable'
    FloorTable:
      type: object
      required: [id, label, capacity, shape, x, y, size]
      properties:
        id: {$ref: '#/components/schemas/PositiveId'}
        label: {type: string}
        capacity: {$ref: '#/components/schemas/GuestCount'}
        shape: {type: string, enum: [round, square]}
        x: {type: integer, minimum: 0}
        y: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, description: Diameter of a round table or side of a square table.}
